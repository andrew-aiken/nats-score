# NATS Server Configuration

server_name: nats-score-server
port: 4222
http_port: 8222

jetstream {
    store_dir: /data/jetstream
    max_memory_store: 268435456   # 256MB
    max_file_store: 1073741824    # 1GB
}

websocket {
    port: 8080
    no_tls: true
}

debug: false
trace: false
logtime: true

